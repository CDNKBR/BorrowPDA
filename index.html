<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>LIFF ยืมคืนอุปกรณ์ IT</title>
  <!-- BorrowPDA LIFF Modal hotfix: 2026-10-02 -->
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --bg:#020617;
      --layer:#020617;
      --card:#0b1220;
      --card-soft:#111827;
      --brand:#22c55e;
      --brand-dark:#16a34a;
      --text:#e5e7eb;
      --muted:#cbd5f5;
      --border:#1f2937;
    }

    body{
      font-family:'IBM Plex Sans Thai',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:linear-gradient(180deg,#07111f 0%,#020617 100%);
      min-height:100svh;
      margin:0;
      padding:10px 10px calc(18px + env(safe-area-inset-bottom));
      display:flex;
      align-items:flex-start;
      justify-content:center;
      color:var(--text);
      font-size:16px;
      box-sizing:border-box;
    }

    .card-main{
      max-width:540px;
      width:100%;
      margin:0 auto;
      border-radius:22px;
      border:1px solid rgba(148,163,184,.4);
      background:linear-gradient(145deg,#020617 0,#020617 40%,#020617 100%);
      box-shadow:
        0 26px 65px rgba(15,23,42,.9),
        0 0 0 1px rgba(15,23,42,.9);
      overflow:hidden;
    }

    .card-header-gradient{
      background:linear-gradient(135deg,var(--brand-dark),var(--brand));
      color:#ecfdf5;
      padding:20px 24px;
    }

    .card-body{
      background:radial-gradient(circle at top,#0b1120,#020617 55%);
      padding:20px 18px 22px;
    }

    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding:.25rem .9rem;
      border-radius:999px;
      font-size:.88rem;
      font-weight:600;
    }
    .status-ava{ background:#bbf7d0; color:#166534; }
    .status-bor{ background:#fee2e2; color:#991b1b; }
    .status-over{ background:#b91c1c; color:#fff; }

    .liff-badge{
      font-size:.75rem;
      text-transform:uppercase;
      letter-spacing:.12em;
      opacity:.92;
    }

    h5#dev-name{
      font-size:1.25rem;
      color:#e5e7eb;
    }

    .text-muted{
      color:var(--muted) !important;
    }

    .small{
      font-size:.9rem;
    }

    .form-label{
      color:#e5e7eb;
      font-size:.95rem;
    }

    .form-control{
      background-color:var(--card-soft);
      border-radius:999px;
      border:1px solid rgba(148,163,184,.6);
      padding:.7rem 1rem;
      font-size:1rem;
      color:var(--text);
    }
    .form-control::placeholder{
      color:#9ca3af;
    }
    .form-control:focus{
      background-color:var(--card-soft);
      border-color:#4ade80;
      box-shadow:0 0 0 .12rem rgba(74,222,128,.35);
      color:var(--text);
    }

    .btn-success{
      background:linear-gradient(135deg,var(--brand-dark),var(--brand));
      border:none;
      border-radius:999px;
      font-weight:600;
      padding:.85rem 1.1rem;
      font-size:1.05rem;
    }
    .btn-success:active{
      background:linear-gradient(135deg,#15803d,#16a34a);
    }

    .btn-danger{
      border-radius:999px;
      font-weight:600;
      padding:.85rem 1.1rem;
      font-size:1.05rem;
    }

    hr{
      border-color:rgba(148,163,184,.4) !important;
      margin-top:24px;
      margin-bottom:24px;
    }

    #no-device-alert{
      border-radius:16px;
      background:rgba(254,243,199,.1);
      border:1px solid rgba(252,211,77,.5);
      color:#fed7aa;
    }

    #message{
      color:#e2e8f0;
    }

    #loadingModal .modal-content{
      background:transparent;
    }
    #loadingModal .loader-shell{
      background:rgba(15,23,42,.96);
      border-radius:22px;
      padding:20px 28px;
      border:1px solid rgba(148,163,184,.6);
    }
    input.form-control{min-height:48px;font-size:16px;border-radius:14px;}
    .btn{min-height:48px;border-radius:14px;font-weight:600;white-space:normal;}
    @media (max-width: 600px){
      body{padding:8px 8px calc(14px + env(safe-area-inset-bottom));}
      .card-main{border-radius:18px;max-width:100%;}
      .card-header-gradient{padding:14px 16px;}
      .card-body{padding:16px 14px 18px;}
      h5#dev-name{font-size:1.15rem;}
      .small{font-size:.88rem;}
    }



    /* BorrowPDA LIFF polish: compact Light Glass + personal history */
    body{
      background:
        radial-gradient(ellipse at 5% 0%,rgba(59,160,255,.20),transparent 34%),
        radial-gradient(ellipse at 96% 12%,rgba(45,212,191,.13),transparent 30%),
        linear-gradient(180deg,#edf5ff 0%,#f8fbff 48%,#edf4ff 100%);
      padding:14px 12px calc(24px + env(safe-area-inset-bottom));
    }
    .card-main{max-width:560px;border-radius:26px}
    .card-header-gradient{padding:21px 23px}
    .card-body{padding:22px 22px 25px}
    #device-block{border-radius:22px;padding:20px 19px;margin:0 0 22px}
    h5#dev-name{font-size:1.5rem;letter-spacing:-.025em}
    #dev-id{font-size:.95rem;line-height:1.55}
    .form-label{display:flex;align-items:center;gap:.45rem;margin-bottom:8px;font-size:.96rem}
    .form-control,.form-select{
      min-height:52px;border-radius:15px;padding:.78rem 1rem;
      border:1px solid #d6e2f2;background:rgba(255,255,255,.94);
      color:#172b49;box-shadow:0 3px 10px rgba(32,73,126,.035);
    }
    .form-control:focus,.form-select:focus{
      border-color:#78baff;background:#fff;box-shadow:0 0 0 .22rem rgba(25,135,245,.12)
    }
    .btn{min-height:52px;border-radius:15px}
    .btn-success{background:linear-gradient(115deg,#1688f8,#00b7a4);box-shadow:0 9px 20px rgba(0,139,226,.18)}
    .btn-danger{background:linear-gradient(115deg,#ef476f,#e63946);border:0}
    .section-kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7290b6}
    .history-panel{
      margin-top:22px;padding:17px;border:1px solid rgba(154,181,218,.32);
      border-radius:21px;background:rgba(255,255,255,.76);
      box-shadow:0 8px 24px rgba(42,80,130,.055)
    }
    .history-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .history-refresh{min-height:36px;padding:6px 11px;border-radius:11px;font-size:.82rem}
    .history-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:12px}
    .history-stat{border-radius:13px;padding:10px 12px;background:#f3f8ff;border:1px solid #e5eefb}
    .history-stat strong{display:block;font-size:1.12rem;color:#183b69}
    .history-stat span{font-size:.78rem;color:#6b7f9c}
    .history-list{display:flex;flex-direction:column;gap:9px}
    .history-item{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:11px;border-radius:14px;background:#fff;border:1px solid #e8eff8}
    .history-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
    .history-icon.borrow{background:#e0f2fe;color:#0369a1}
    .history-icon.return{background:#dcfce7;color:#15803d}
    .history-title{font-weight:700;color:#183153;font-size:.92rem;line-height:1.35}
    .history-meta{font-size:.78rem;color:#71839d;line-height:1.5;margin-top:3px;overflow-wrap:anywhere}
    .history-note{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;background:#eff6ff;color:#315b8f;font-size:.76rem}
    .history-empty{padding:20px 10px;text-align:center;color:#71839d;font-size:.88rem}
    .history-loading{opacity:.65}
    @media(max-width:600px){
      body{padding:9px 8px calc(18px + env(safe-area-inset-bottom))}
      .card-main{border-radius:22px}
      .card-header-gradient{padding:17px 17px}
      .card-body{padding:17px 15px 20px}
      #device-block{padding:17px 15px;margin-bottom:19px}
      .history-panel{padding:14px}
    }

    .form-control::placeholder{color:#8a9bb4;}

      body{padding:8px 8px calc(14px + env(safe-area-inset-bottom));}

    @media(prefers-reduced-motion:reduce){.btn{transition:none;}}

<body>
  <div class="card card-main">
    <div class="card-header-gradient d-flex justify-content-between align-items-center">
      <div>
        <div class="liff-badge">
          <i class="bi bi-chat-right-dots-fill me-1"></i>LINE LIFF
        </div>
        <div class="fw-semibold"><i class="bi bi-box-seam-fill me-1" style="color:#0788f9"></i>BorrowPDA</div>
        <div class="small">IT Equipment • ระบบยืม–คืนอุปกรณ์</div>
        
      </div>
      <div class="d-flex align-items-center gap-2 text-end small">
        <div>
          <div id="user-name" class="fw-semibold"></div>
          <div id="user-id" style="opacity:.85;"></div>
        </div>
        <img id="user-picture" alt="รูปโปรไฟล์ LINE" src="" width="42" height="42"
             style="display:none;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:#e5e7eb;" />
      </div>
    </div>

    <div class="card-body">
      <div id="device-block" class="mb-3">
        <h5 class="fw-semibold mb-1" id="dev-name">กำลังโหลด...</h5>
        <div class="text-muted small mb-2" id="dev-id"></div>
        <div id="dev-status"></div>
      </div>

      <div class="alert alert-warning py-2 px-3 small d-none" id="no-device-alert">
        <i class="bi bi-exclamation-circle me-1"></i>
        ไม่พบรหัสอุปกรณ์จากลิงก์ LIFF กรุณาสแกน QR อุปกรณ์อีกครั้ง
      </div>

      <div id="form-borrow" class="mt-3" style="display:none;">
        <label class="form-label small fw-semibold">
          <i class="bi bi-person-badge me-1"></i>ชื่อผู้ยืม
        </label>
        <input type="text" class="form-control mb-2" id="borrower"
              placeholder="ระบุชื่อผู้ยืม" autocomplete="name">
        <label class="form-label small fw-semibold mt-2" for="department">
          <i class="bi bi-building me-1"></i>แผนก
        </label>
        <select class="form-select mb-2" id="department" required>
          <option value="">กำลังโหลดรายการแผนก...</option>
        </select>
        <div class="small text-muted mb-3"><i class="bi bi-clock me-1"></i>ยืมได้ 10 ชั่วโมงต่ออุปกรณ์ และต้องคืนก่อนผู้ใช้อื่นยืมต่อ</div>

        <button class="btn btn-success w-100 py-3" onclick="borrow()">
          <i class="bi bi-box-arrow-in-right me-1"></i>ยืมอุปกรณ์ผ่าน LINE
        </button>
      </div>

      <div id="form-return" class="mt-3" style="display:none;">
        <div id="returner-wrap" class="mb-3" style="display:none;">
          <label class="form-label small fw-semibold" for="returner">ยืนยันชื่อผู้ยืมเดิม</label>
          <input type="text" class="form-control" id="returner" placeholder="กรอกชื่อผู้ยืมเดิม">
        </div>
        <button class="btn btn-danger w-100 py-3" onclick="returnDevice()">
          <i class="bi bi-arrow-return-left me-1"></i>คืนอุปกรณ์ผ่าน LINE
        </button>
      </div>

      <hr class="my-3 border-secondary">
      <div id="message" class="small text-muted"></div>

      <section id="user-history" class="history-panel" aria-labelledby="history-heading">
        <div class="history-toolbar">
          <div>
            <div class="section-kicker">Personal activity</div>
            <div id="history-heading" class="fw-bold"><i class="bi bi-clock-history me-1"></i>ประวัติยืม–คืนของฉัน</div>
          </div>
          <button type="button" class="btn btn-outline-primary history-refresh" id="history-refresh" onclick="loadUserHistory()">
            <i class="bi bi-arrow-clockwise me-1"></i>รีเฟรช
          </button>
        </div>
        <div id="history-summary" class="history-summary" style="display:none"></div>
        <div id="history-list" class="history-list">
          <div class="history-empty"><i class="bi bi-person-check me-1"></i>กำลังตรวจสอบบัญชี LINE...</div>
        </div>
      </section>
    </div>
  </div>

  <div class="modal fade" id="noticeModal" tabindex="-1" aria-labelledby="noticeTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center p-4">
          <div id="noticeIcon" class="notice-icon info"><i class="bi bi-info-circle-fill"></i></div>
          <h5 id="noticeTitle" class="modal-title mb-2">แจ้งให้ทราบ</h5>
          <div id="noticeText" class="modal-body p-0 mb-4">รายละเอียด</div>
          <button type="button" id="noticeOk" class="btn btn-primary w-100" data-bs-dismiss="modal">ตกลง</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-none">
        <div class="d-flex justify-content-center">
          <div class="loader-shell text-center text-white">
            <div class="spinner-border mb-3" role="status"></div>
            <div>กำลังประมวลผล...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const RAW_QUERY = {};
    const LIFF_ID = '2008359490-qm3K4L5x';
    // Replace this with the deployed Apps Script Web App URL ending in /exec
    const API_URL = 'https://script.google.com/macros/s/AKfycbzkgWzwmv768EfzxMhZU-TzuLrMCx73zJOByDFDFcnzbbLJsOaCNkaHzVcxbncB_-b2/exec?api=borrowPda';

    let loadingModal;
    let noticeModal;
    let lineUserId = '';
    let lineDisplayName = '';
    let linePictureUrl = '';
    let deviceID = '';
    let liffFinished = false;

    function setMessage(msg) {
      document.getElementById('message').textContent = msg || '';
    }

    function showNotice(message, type = 'info', title) {
      const config = {
        success: { title: 'ดำเนินการสำเร็จ', icon: 'bi-check-circle-fill', button: 'btn-success' },
        error:   { title: 'ไม่สามารถดำเนินการได้', icon: 'bi-x-circle-fill', button: 'btn-danger' },
        warning:{ title: 'กรุณาตรวจสอบ', icon: 'bi-exclamation-triangle-fill', button: 'btn-warning' },
        info:    { title: 'แจ้งให้ทราบ', icon: 'bi-info-circle-fill', button: 'btn-primary' }
      };
      const item = config[type] || config.info;
      document.getElementById('noticeTitle').textContent = title || item.title;
      document.getElementById('noticeText').textContent = String(message || '');
      const icon = document.getElementById('noticeIcon');
      icon.className = 'notice-icon ' + (config[type] ? type : 'info');
      icon.innerHTML = '<i class="bi ' + item.icon + '"></i>';
      const button = document.getElementById('noticeOk');
      button.className = 'btn w-100 ' + item.button;
      if (noticeModal) noticeModal.show();
    }

    // Convert any remaining native browser alert() calls to the in-page Bootstrap Modal.
    // This also protects against legacy validation code that still calls alert().
    window.alert = function(message) {
      showNotice(String(message == null ? '' : message), 'warning');
    };

    function showLoading(msg){
      if (msg) setMessage(msg);
      if (loadingModal) loadingModal.show();
    }

    function hideLoading(){
      try{
        if (loadingModal) loadingModal.hide();
      }catch(e){}
    }

    window.addEventListener('error', function(e){
      const msg = 'JS Error: ' + (e.message || e.error || e.toString());
      setMessage(msg);
      hideLoading();
      showNotice(msg, 'error', 'เกิดข้อผิดพลาด');
    });

    window.addEventListener('unhandledrejection', function(e){
      const reason = e.reason || {};
      const msg = 'Promise Error: ' + (reason.message || reason.code || reason.toString());
      setMessage(msg);
      hideLoading();
      showNotice(msg, 'error', 'เกิดข้อผิดพลาด');
    });

    function getDeviceFromQuery(){
      try {
        if (RAW_QUERY && typeof RAW_QUERY === 'object') {
          if (RAW_QUERY.device) {
            return String(RAW_QUERY.device).toUpperCase();
          }
          if (RAW_QUERY['liff.state']) {
            const stateParams = new URLSearchParams(String(RAW_QUERY['liff.state']));
            const d = stateParams.get('device') || stateParams.get('DEVICE') || '';
            if (d) return d.toUpperCase();
          }
        }
        const params = new URLSearchParams(location.search || '');
        const direct = params.get('device');
        if (direct) return direct.toUpperCase();

        const liffState = params.get('liff.state');
        if (liffState) {
          const sp = new URLSearchParams(liffState);
          const d = sp.get('device') || sp.get('DEVICE') || '';
          if (d) return d.toUpperCase();
        }
      } catch (e) {
        setMessage('อ่านค่า device จาก URL ไม่ได้: ' + e);
      }
      return '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const modalEl = document.getElementById('loadingModal');
      loadingModal = new bootstrap.Modal(modalEl, {
        backdrop:'static',
        keyboard:false
      });
      noticeModal = new bootstrap.Modal(document.getElementById('noticeModal'), {
        backdrop: true,
        keyboard: true
      });

      deviceID = getDeviceFromQuery();
      tryInitLiffWithTimeout();
    });

    function tryInitLiffWithTimeout(){
      showLoading('กำลังเชื่อมต่อ LINE LIFF...');

      if (typeof liff === 'undefined') {
        startAppWithoutLiff('ไม่สามารถโหลด LIFF SDK ได้');
        return;
      }

      let timeoutId = setTimeout(() => {
        if (!liffFinished) {
          startAppWithoutLiff('การเชื่อมต่อกับ LIFF ช้าผิดปกติ');
        }
      }, 15000);

      setMessage('เรียกใช้ liff.init...');

      liff.init({ liffId: LIFF_ID })
        .then(async () => {
          if (liffFinished) return;
          setMessage('เชื่อมต่อ LIFF สำเร็จ กำลังตรวจสอบโปรไฟล์...');

          let profile = null;
          let ctx = null;
          let profileError = null;
          let contextError = null;

          // แยกคำสั่งเพื่อระบุให้ได้ว่าการอ่านโปรไฟล์หรือ Context ล้มเหลว
          try {
            if (typeof liff.isLoggedIn === 'function' && !liff.isLoggedIn()) {
              profileError = new Error('LINE ยังไม่ได้เข้าสู่ระบบ LIFF');
            } else {
              profile = await liff.getProfile();
            }
          } catch (err) {
            profileError = err;
          }

          try {
            ctx = liff.getContext();
          } catch (err) {
            contextError = err;
          }

          if (liffFinished) return;

          const resolvedDisplayName = (profile && profile.displayName)
            ? String(profile.displayName).trim()
            : '';
          const resolvedUserId = (profile && profile.userId)
            ? String(profile.userId).trim()
            : ((ctx && ctx.userId) ? String(ctx.userId).trim() : '');

          lineDisplayName = resolvedDisplayName;
          lineUserId = resolvedUserId;
          linePictureUrl = (profile && profile.pictureUrl) ? String(profile.pictureUrl) : '';
          const pictureEl = document.getElementById('user-picture');
          if (linePictureUrl && pictureEl) {
            pictureEl.src = linePictureUrl;
            pictureEl.style.display = 'block';
            pictureEl.onerror = () => { pictureEl.style.display = 'none'; };
          }

          if (lineDisplayName) {
            document.getElementById('user-name').textContent = lineDisplayName;
          } else {
            document.getElementById('user-name').textContent = 'ไม่ได้รับชื่อจาก LINE';
          }
          document.getElementById('user-id').textContent =
            lineUserId ? lineUserId.substring(0, 6) + '…' : '';

          const borrowerInput = document.getElementById('borrower');
          if (lineDisplayName && borrowerInput && !borrowerInput.value) {
            borrowerInput.value = lineDisplayName;
          }

          liffFinished = true;
          clearTimeout(timeoutId);
          startApp();

          if (!lineUserId || !lineDisplayName) {
            const details = [];
            if (profileError) {
              details.push('getProfile: ' + (profileError.message || profileError.code || String(profileError)));
            }
            if (contextError) {
              details.push('getContext: ' + (contextError.message || contextError.code || String(contextError)));
            }
            if (!details.length) {
              details.push('LINE ไม่ส่ง User ID หรือ Display Name กลับมา');
            }
            setMessage('เปิดใช้งานได้ แต่ดึงโปรไฟล์ LINE ไม่ครบ (' +
              details.join(' | ') +
              ') กรุณากรอกชื่อผู้ยืมเอง ระบบจะบันทึกข้อมูล LINE เฉพาะเมื่ออ่านได้');
          } else {
            setMessage('ยืนยันโปรไฟล์ LINE สำเร็จ');
          }
        })
        .catch(err => {
          if (liffFinished) return;
          clearTimeout(timeoutId);
          startAppWithoutLiff(
            'เริ่มต้น LIFF ไม่สำเร็จ: ' +
            (err && (err.message || err.code) ? (err.message || err.code) : String(err))
          );
        });
    }

    function startAppWithoutLiff(reason){
      if (liffFinished) return;
      liffFinished = true;
      hideLoading();
      setMessage((reason ? reason + ' — ' : '') +
        'ยังอ่านโปรไฟล์ LINE ไม่ได้ แต่ยังทำรายการได้โดยกรอกชื่อผู้ยืมเอง ชื่อ LINE จะบันทึกได้เมื่ออนุญาต Scope profile');
      // Keep the original borrowing workflow usable when LINE profile lookup fails.
      // Never invent a LINE user ID/display name; use manual borrower name as fallback.
      startApp();
    }

    function startApp(){
      if (!deviceID) {
        hideLoading();
        document.getElementById('dev-name').textContent = 'ไม่มีรหัสอุปกรณ์';
        document.getElementById('no-device-alert').classList.remove('d-none');
        setMessage('ไม่พบพารามิเตอร์ device ใน URL กรุณาสแกน QR อุปกรณ์อีกครั้ง');
        return;
      }
      loadDepartments();
      loadDevice();
      loadUserHistory();
    }

    function loadDepartments(){
      const select = document.getElementById('department');
      if (!select) return;
      select.innerHTML = '<option value="">กำลังโหลดรายการแผนก...</option>';
      apiCall({ action: 'departments' }, res => {
        if (!res || !res.ok || !Array.isArray(res.data)) {
          select.innerHTML = '<option value="">โหลดแผนกไม่สำเร็จ</option>';
          return;
        }
        const departments = [...new Set(res.data.map(v => String(v || '').trim()).filter(Boolean))];
        select.innerHTML = '<option value="">-- เลือกแผนก --</option>';
        departments.forEach(dept => {
          const option = document.createElement('option');
          option.value = dept;
          option.textContent = dept;
          select.appendChild(option);
        });
        if (!departments.length) select.innerHTML = '<option value="">ไม่พบข้อมูลแผนกใน Config</option>';
      });
    }

    function loadDevice(){
      showLoading('กำลังโหลดข้อมูลอุปกรณ์...');

      apiCall({ action: 'status', deviceID }, res => {
        if (res && res.ok) renderDevice(res.data);
        else {
          hideLoading();
          document.getElementById('dev-name').textContent = 'เกิดข้อผิดพลาด';
          setMessage('ไม่สามารถโหลดข้อมูลอุปกรณ์ได้: ' + ((res && res.error) || 'API error'));
        }
      });
    }

    function renderDevice(info){
      hideLoading();

      if (!info) {
        document.getElementById('dev-name').textContent = 'ไม่พบอุปกรณ์ในระบบ';
        document.getElementById('dev-id').textContent   = deviceID;
        setMessage('ตรวจสอบ DeviceID ในชีต Devices อีกครั้ง');
        return;
      }

      document.getElementById('dev-name').textContent =
        info.Name || '(ไม่มีชื่ออุปกรณ์)';
      document.getElementById('dev-id').textContent =
        `รหัส: ${info.DeviceID} • หมวด: ${info.Category || '-'}`;

      const statusDiv = document.getElementById('dev-status');
      statusDiv.innerHTML = '';

      const pill = document.createElement('div');
      let cls = 'status-pill ';
      let icon = '';

      if (info.IsOverdue) {
        cls += 'status-over';
        pill.textContent = 'เกินกำหนดคืน';
        icon = '<i class="bi bi-exclamation-octagon-fill me-1"></i>';
      } else if (info.Status === 'Borrowed') {
        cls += 'status-bor';
        pill.textContent = 'ถูกยืมอยู่';
        icon = '<i class="bi bi-lock-fill me-1"></i>';
      } else {
        cls += 'status-ava';
        pill.textContent = 'พร้อมให้ยืม';
        icon = '<i class="bi bi-unlock-fill me-1"></i>';
      }

      pill.className = cls;
      pill.innerHTML = icon + pill.textContent;
      statusDiv.appendChild(pill);

      const formBorrow = document.getElementById('form-borrow');
      const formReturn = document.getElementById('form-return');
      let ownershipMessage = '';

      if (info.Status === 'Available') {
        formBorrow.style.display = 'block';
        formReturn.style.display = 'none';
      } else {
        formBorrow.style.display = 'none';
        formReturn.style.display = 'block';
      }

      const msg = [];
      if (info.CurrentUser) msg.push(`ผู้ยืม: ${info.CurrentUser}`);
      if (info.BorrowedAt) msg.push(`วันที่ยืม: ${formatDate(info.BorrowedAt)}`);
      if (info.DueAt)      msg.push(`กำหนดคืน: ${formatDate(info.DueAt)}`);
      if (ownershipMessage) msg.push(ownershipMessage);
      setMessage(msg.join(' | '));
    }

    function borrow(){
      const nameInput = document.getElementById('borrower').value.trim();

      // ถ้าไม่กรอก → ใช้ชื่อจาก LINE
      const nameBase  = nameInput || lineDisplayName;

      if (!deviceID) {
        showNotice('ไม่มีรหัสอุปกรณ์ กรุณาสแกน QR ของอุปกรณ์อีกครั้ง', 'warning');
        return;
      }

      // Profile is optional for the transaction so a LIFF profile-scope/configuration
      // issue does not disable borrowing. Prefer LINE display name when available;
      // otherwise use the required manually-entered borrower name. Empty LINE fields
      // are passed explicitly and never fabricated.
      if (!nameBase) {
        showNotice('กรุณาระบุชื่อผู้ยืมในช่องชื่อผู้ยืม', 'warning');
        document.getElementById('borrower').focus();
        return;
      }
      const name = nameBase;
      const department = document.getElementById('department').value.trim();

      if (!department) {
        showNotice('กรุณาระบุแผนก', 'warning');
        document.getElementById('department').focus();
        return;
      }

      showLoading('กำลังบันทึกการยืม...');

      apiCall({
        action: 'borrow',
        deviceID, userName: name, note: department, lineUserId, lineDisplayName, linePictureUrl
      }, res => {
        hideLoading();
        if (!res || !res.ok) { showNotice((res && res.error) || 'ยืมไม่สำเร็จ', 'error'); return; }
        showNotice(res.data.message || 'ยืมสำเร็จ', 'success');
        if (res.data && res.data.newInfo) renderDevice(res.data.newInfo);
        else loadDevice();
        loadUserHistory();
      });
    }

    function returnDevice(){
      const returner = document.getElementById('returner').value.trim();
      if (!lineUserId && !returner) { showNotice('กรุณายืนยันชื่อผู้ยืมเดิม', 'warning'); return; }
      if (!deviceID) {
        showNotice('ไม่มีรหัสอุปกรณ์ กรุณาสแกน QR ของอุปกรณ์อีกครั้ง', 'warning');
        return;
      }

      showLoading('กำลังบันทึกการคืน...');

      apiCall({
        action: 'return',
        deviceID,
        userName: returner || lineDisplayName || '',
        lineUserId,
        lineDisplayName,
        linePictureUrl
      }, res => {
        hideLoading();
        if (!res || !res.ok) { showNotice((res && res.error) || 'คืนไม่สำเร็จ', 'error'); return; }
        showNotice(res.data.message || 'คืนสำเร็จ', 'success');
        if (res.data && res.data.newInfo) renderDevice(res.data.newInfo);
        else loadDevice();
        loadUserHistory();
      });
    }

    function loadUserHistory(){
      const list = document.getElementById('history-list');
      const summary = document.getElementById('history-summary');
      const button = document.getElementById('history-refresh');
      if (!list) return;

      if (!lineUserId) {
        list.innerHTML = '<div class="history-empty"><i class="bi bi-info-circle me-1"></i>กรุณาเปิดผ่าน LINE และอนุญาตให้ระบบอ่านโปรไฟล์ เพื่อดูประวัติส่วนตัว</div>';
        if (summary) summary.style.display = 'none';
        return;
      }

      if (button) button.disabled = true;
      list.classList.add('history-loading');
      list.innerHTML = '<div class="history-empty"><span class="spinner-border spinner-border-sm me-2"></span>กำลังโหลดประวัติของคุณ...</div>';

      apiCall({ action: 'userhistory', lineUserId }, res => {
        if (button) button.disabled = false;
        list.classList.remove('history-loading');

        if (!res || res.ok !== true || !Array.isArray(res.data)) {
          const detail = res && res.error ? String(res.error) : 'API ตอบกลับไม่ตรงรูปแบบที่คาดไว้';
          list.innerHTML = '';
          const errorBox = document.createElement('div');
          errorBox.className = 'history-empty';
          const title = document.createElement('div');
          title.className = 'fw-bold mb-1';
          title.textContent = 'โหลดประวัติไม่สำเร็จ';
          const detailText = document.createElement('div');
          detailText.textContent = detail;
          const hint = document.createElement('div');
          hint.className = 'small mt-2';
          hint.textContent = 'หากเพิ่งอัปเดต Code.gs ให้ Deploy เป็น New version แล้วเปิด LIFF ใหม่';
          errorBox.append(title, detailText, hint);
          list.appendChild(errorBox);
          if (summary) summary.style.display = 'none';
          return;
        }

        const items = res.data;
        const borrowed = items.filter(x => String(x.Action || '').toLowerCase() === 'borrow').length;
        const returned = items.filter(x => String(x.Action || '').toLowerCase() === 'return').length;

        if (summary) {
          summary.innerHTML =
            '<div class="history-stat"><strong>' + borrowed + '</strong><span><i class="bi bi-box-arrow-up-right me-1"></i>รายการยืม</span></div>' +
            '<div class="history-stat"><strong>' + returned + '</strong><span><i class="bi bi-box-arrow-in-left me-1"></i>รายการคืน</span></div>';
          summary.style.display = 'grid';
        }

        if (!items.length) {
          list.innerHTML = '<div class="history-empty"><i class="bi bi-journal-text fs-4 d-block mb-2"></i>ยังไม่พบประวัติยืม–คืนของบัญชี LINE นี้</div>';
          return;
        }

        list.innerHTML = '';
        items.forEach(item => {
          const isBorrow = String(item.Action || '').toLowerCase() === 'borrow';
          const row = document.createElement('article');
          row.className = 'history-item';

          const icon = document.createElement('div');
          icon.className = 'history-icon ' + (isBorrow ? 'borrow' : 'return');
          icon.innerHTML = '<i class="bi ' + (isBorrow ? 'bi-box-arrow-up-right' : 'bi-box-arrow-in-left') + '"></i>';

          const body = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'history-title';
          title.textContent = (isBorrow ? 'ยืมอุปกรณ์' : 'คืนอุปกรณ์') + ' • ' + (item.DeviceID || '-');

          const meta = document.createElement('div');
          meta.className = 'history-meta';
          meta.textContent = (item.Timestamp || '-') + (item.UserName ? ' · ' + item.UserName : '') +
            (item.BorrowedAt ? ' · เริ่มยืม ' + item.BorrowedAt : '') +
            (item.DueAt && isBorrow ? ' · กำหนดคืน ' + item.DueAt : '');

          body.appendChild(title);
          body.appendChild(meta);
          if (item.Note) {
            const note = document.createElement('div');
            note.className = 'history-note';
            note.textContent = 'แผนก: ' + item.Note;
            body.appendChild(note);
          }
          row.appendChild(icon);
          row.appendChild(body);
          list.appendChild(row);
        });
      });
    }

    function apiCall(params, done) {
      if (!API_URL || API_URL.includes('PASTE_YOUR_')) {
        hideLoading();
        setMessage('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html');
        return;
      }
      const callbackName = 'borrowPdaCb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      const payload = Object.assign({}, params, { callback: callbackName });
      const query = Object.keys(payload).map(k =>
        encodeURIComponent(k) + '=' + encodeURIComponent(String(payload[k] == null ? '' : payload[k]))
      ).join('&');
      let finished = false;
      const timer = setTimeout(() => {
        if (finished) return;
        finished = true;
        cleanup();
        hideLoading();
        setMessage('API ไม่ตอบกลับภายใน 25 วินาที กรุณาตรวจ API_URL และ Deployment');
      }, 25000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[callbackName] = result => {
        if (finished) return;
        finished = true;
        cleanup();
        done(result);
      };
      script.onerror = () => {
        if (finished) return;
        finished = true;
        cleanup();
        hideLoading();
        setMessage('เรียก Apps Script API ไม่สำเร็จ (script.onerror) กรุณาตรวจ URL และการ Deploy');
      };
      script.onload = () => {
        // If the script loaded but never called the JSONP callback, the endpoint
        // likely rejected/ignored the callback parameter or returned non-JSONP content.
        if (!finished) {
          setMessage('โหลด API script แล้ว แต่ไม่ได้เรียก JSONP callback; ตรวจชื่อ callback และรูปแบบการตอบกลับของ Apps Script');
        }
      };
      script.src = API_URL + (API_URL.includes('?') ? '&' : '?') + query;
      document.head.appendChild(script);
    }

    function formatDate(d){
      try{
        return new Date(d).toLocaleString('th-TH');
      }catch(e){
        return d;
      }
    }
  </script>
</body>
