<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>LIFF ยืมคืนอุปกรณ์ IT</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --bg:#020617;
      --layer:#020617;
      --card:#0b1220;
      --card-soft:#111827;
      --brand:#22c55e;
      --brand-dark:#16a34a;
      --text:#e5e7eb;
      --muted:#cbd5f5;
      --border:#1f2937;
    }

    body{
      font-family:'IBM Plex Sans Thai',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:linear-gradient(180deg,#07111f 0%,#020617 100%);
      min-height:100svh;
      margin:0;
      padding:10px 10px calc(18px + env(safe-area-inset-bottom));
      display:flex;
      align-items:flex-start;
      justify-content:center;
      color:var(--text);
      font-size:16px;
      box-sizing:border-box;
    }

    .card-main{
      max-width:540px;
      width:100%;
      margin:0 auto;
      border-radius:22px;
      border:1px solid rgba(148,163,184,.4);
      background:linear-gradient(145deg,#020617 0,#020617 40%,#020617 100%);
      box-shadow:
        0 26px 65px rgba(15,23,42,.9),
        0 0 0 1px rgba(15,23,42,.9);
      overflow:hidden;
    }

    .card-header-gradient{
      background:linear-gradient(135deg,var(--brand-dark),var(--brand));
      color:#ecfdf5;
      padding:20px 24px;
    }

    .card-body{
      background:radial-gradient(circle at top,#0b1120,#020617 55%);
      padding:20px 18px 22px;
    }

    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding:.25rem .9rem;
      border-radius:999px;
      font-size:.88rem;
      font-weight:600;
    }
    .status-ava{ background:#bbf7d0; color:#166534; }
    .status-bor{ background:#fee2e2; color:#991b1b; }
    .status-over{ background:#b91c1c; color:#fff; }

    .liff-badge{
      font-size:.75rem;
      text-transform:uppercase;
      letter-spacing:.12em;
      opacity:.92;
    }

    h5#dev-name{
      font-size:1.25rem;
      color:#e5e7eb;
    }

    .text-muted{
      color:var(--muted) !important;
    }

    .small{
      font-size:.9rem;
    }

    .form-label{
      color:#e5e7eb;
      font-size:.95rem;
    }

    .form-control{
      background-color:var(--card-soft);
      border-radius:999px;
      border:1px solid rgba(148,163,184,.6);
      padding:.7rem 1rem;
      font-size:1rem;
      color:var(--text);
    }
    .form-control::placeholder{
      color:#9ca3af;
    }
    .form-control:focus{
      background-color:var(--card-soft);
      border-color:#4ade80;
      box-shadow:0 0 0 .12rem rgba(74,222,128,.35);
      color:var(--text);
    }

    .btn-success{
      background:linear-gradient(135deg,var(--brand-dark),var(--brand));
      border:none;
      border-radius:999px;
      font-weight:600;
      padding:.85rem 1.1rem;
      font-size:1.05rem;
    }
    .btn-success:active{
      background:linear-gradient(135deg,#15803d,#16a34a);
    }

    .btn-danger{
      border-radius:999px;
      font-weight:600;
      padding:.85rem 1.1rem;
      font-size:1.05rem;
    }

    hr{
      border-color:rgba(148,163,184,.4) !important;
      margin-top:24px;
      margin-bottom:24px;
    }

    #no-device-alert{
      border-radius:16px;
      background:rgba(254,243,199,.1);
      border:1px solid rgba(252,211,77,.5);
      color:#fed7aa;
    }

    #message{
      color:#e2e8f0;
    }

    #loadingModal .modal-content{
      background:transparent;
    }
    #loadingModal .loader-shell{
      background:rgba(15,23,42,.96);
      border-radius:22px;
      padding:20px 28px;
      border:1px solid rgba(148,163,184,.6);
    }
    input.form-control{min-height:48px;font-size:16px;border-radius:14px;}
    .btn{min-height:48px;border-radius:14px;font-weight:600;white-space:normal;}
    @media (max-width: 600px){
      body{padding:8px 8px calc(14px + env(safe-area-inset-bottom));}
      .card-main{border-radius:18px;max-width:100%;}
      .card-header-gradient{padding:14px 16px;}
      .card-body{padding:16px 14px 18px;}
      h5#dev-name{font-size:1.15rem;}
      .small{font-size:.88rem;}
    }


    /* ===== BorrowPDA Re-Design: Option 3 - Light Glass ===== */
    :root{
      --bg:#eaf3ff;
      --layer:#f8fbff;
      --card:rgba(255,255,255,.82);
      --card-soft:rgba(245,249,255,.92);
      --brand:#0788f9;
      --brand-dark:#0875df;
      --text:#14213d;
      --muted:#60718e;
      --border:rgba(125,157,202,.24);
    }
    html{min-height:100%;background:#eaf3ff;}
    body{
      color:var(--text);
      background:
        radial-gradient(ellipse at 8% 2%,rgba(80,166,255,.24),transparent 35%),
        radial-gradient(ellipse at 95% 20%,rgba(129,194,255,.30),transparent 36%),
        linear-gradient(180deg,#e8f2ff 0%,#f6f9ff 55%,#eaf2ff 100%);
      padding:12px 10px calc(20px + env(safe-area-inset-bottom));
    }
    .card-main{
      border:1px solid rgba(255,255,255,.92);
      background:rgba(255,255,255,.66);
      box-shadow:0 18px 50px rgba(43,91,150,.14),0 2px 10px rgba(43,91,150,.07),inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter:blur(22px) saturate(145%);
      -webkit-backdrop-filter:blur(22px) saturate(145%);
    }
    .card-header-gradient{
      color:#10284b;
      background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(229,242,255,.88));
      border-bottom:1px solid rgba(130,170,220,.22);
      padding:20px 22px;
    }
    .card-header-gradient .small{color:#617795!important;}
    .liff-badge{color:#087ce5;letter-spacing:.13em;font-weight:700;}
    .card-header-gradient .fw-semibold{color:#10284b;}
    #user-picture{
      border:2px solid rgba(255,255,255,.98)!important;
      box-shadow:0 3px 12px rgba(30,83,145,.2);
    }
    .card-body{
      color:#152746;
      background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(246,250,255,.93));
      padding:22px 20px 24px;
    }
    h5#dev-name{color:#142b4d;font-size:1.35rem;font-weight:700;letter-spacing:-.015em;}
    .text-muted{color:#60718e!important;}
    #dev-id{color:#60718e!important;}
    #device-block{
      padding:17px 16px 16px;
      margin-left:-2px;margin-right:-2px;
      border:1px solid rgba(150,180,220,.25);
      border-radius:20px;
      background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(239,247,255,.76));
      box-shadow:0 6px 18px rgba(52,99,157,.06),inset 0 1px 0 rgba(255,255,255,.95);
    }
    .status-pill{padding:.42rem .88rem;font-size:.88rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.55);}
    .status-ava{background:#d8fbe7;color:#087a45;border:1px solid #b9f0d0;}
    .status-bor{background:#fff0d7;color:#9b5b00;border:1px solid #ffe0a7;}
    .status-over{background:#ffe1e5;color:#b42338;border:1px solid #ffc4cd;}
    .form-label{color:#203655;font-weight:600;}
    .form-control{
      color:#172b49;background:rgba(255,255,255,.88);border:1px solid rgba(139,166,205,.38);
      border-radius:15px;padding:.78rem 1rem;box-shadow:0 2px 8px rgba(38,80,130,.035);
    }
    .form-control::placeholder{color:#8a9bb4;}
    .form-control:focus{color:#172b49;background:#fff;border-color:#65b4ff;box-shadow:0 0 0 .2rem rgba(28,139,245,.13);}
    .btn{min-height:52px;border-radius:16px;font-weight:700;letter-spacing:.005em;transition:transform .15s ease,box-shadow .15s ease;}
    .btn:active{transform:scale(.99);}
    .btn-success{
      color:#fff;background:linear-gradient(135deg,#0788f9,#00b7a4);border:0;
      box-shadow:0 8px 18px rgba(0,139,226,.20),inset 0 1px 0 rgba(255,255,255,.22);
    }
    .btn-success:hover,.btn-success:focus{color:#fff;background:linear-gradient(135deg,#0878e3,#009f91);box-shadow:0 10px 22px rgba(0,139,226,.25);}
    .btn-danger{
      color:#fff;background:linear-gradient(135deg,#087ff0,#1767dc);border:0;
      box-shadow:0 8px 18px rgba(22,105,220,.20),inset 0 1px 0 rgba(255,255,255,.22);
    }
    .btn-danger:hover,.btn-danger:focus{color:#fff;background:linear-gradient(135deg,#086ed1,#155ac4);}
    hr{border-color:rgba(137,164,202,.28)!important;opacity:1;}
    #no-device-alert{border-radius:16px;background:rgba(255,247,224,.9);border:1px solid #f6d88c;color:#865900;}
    #message{color:#5c6f8b!important;line-height:1.55;overflow-wrap:anywhere;}
    #loadingModal .loader-shell{background:rgba(255,255,255,.96);color:#17345c!important;border:1px solid rgba(155,186,226,.45);box-shadow:0 20px 55px rgba(35,75,125,.18);backdrop-filter:blur(18px);}
    #loadingModal .spinner-border{color:#0788f9!important;}
    @media(max-width:600px){
      body{padding:8px 8px calc(14px + env(safe-area-inset-bottom));}
      .card-main{border-radius:23px;}
      .card-header-gradient{padding:17px 16px;}
      .card-body{padding:17px 14px 20px;}
      #device-block{padding:16px 14px;border-radius:18px;}
      h5#dev-name{font-size:1.22rem;}
      .btn{min-height:54px;}
    }
    @media(prefers-reduced-motion:reduce){.btn{transition:none;}}

  </style>
</head>
<body>
  <div class="card card-main">
    <div class="card-header-gradient d-flex justify-content-between align-items-center">
      <div>
        <div class="liff-badge">
          <i class="bi bi-chat-right-dots-fill me-1"></i>LINE LIFF
        </div>
        <div class="fw-semibold"><i class="bi bi-box-seam-fill me-1" style="color:#0788f9"></i>BorrowPDA</div>
        <div class="small">IT Equipment • ระบบยืม–คืนอุปกรณ์</div>
        
      </div>
      <div class="d-flex align-items-center gap-2 text-end small">
        <div>
          <div id="user-name" class="fw-semibold"></div>
          <div id="user-id" style="opacity:.85;"></div>
        </div>
        <img id="user-picture" alt="รูปโปรไฟล์ LINE" src="" width="42" height="42"
             style="display:none;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:#e5e7eb;" />
      </div>
    </div>

    <div class="card-body">
      <div id="device-block" class="mb-3">
        <h5 class="fw-semibold mb-1" id="dev-name">กำลังโหลด...</h5>
        <div class="text-muted small mb-2" id="dev-id"></div>
        <div id="dev-status"></div>
      </div>

      <div class="alert alert-warning py-2 px-3 small d-none" id="no-device-alert">
        <i class="bi bi-exclamation-circle me-1"></i>
        ไม่พบรหัสอุปกรณ์จากลิงก์ LIFF กรุณาสแกน QR อุปกรณ์อีกครั้ง
      </div>

      <div id="form-borrow" class="mt-3" style="display:none;">
        <label class="form-label small fw-semibold">
          <i class="bi bi-person-badge me-1"></i>ชื่อผู้ยืม
        </label>
        <input type="text" class="form-control mb-2" id="borrower"
              placeholder="ระบุชื่อ และแผนกให้ครบถ้วน">
        <div class="small text-muted mb-3"><i class="bi bi-clock me-1"></i>ยืมได้ 10 ชั่วโมงต่ออุปกรณ์ และต้องคืนก่อนผู้ใช้อื่นยืมต่อ</div>

        <button class="btn btn-success w-100 py-3" onclick="borrow()">
          <i class="bi bi-box-arrow-in-right me-1"></i>ยืมอุปกรณ์ผ่าน LINE
        </button>
      </div>

      <div id="form-return" class="mt-3" style="display:none;">
        <div id="returner-wrap" class="mb-3" style="display:none;">
          <label class="form-label small fw-semibold" for="returner">ยืนยันชื่อผู้ยืมเดิม</label>
          <input type="text" class="form-control" id="returner" placeholder="กรอกชื่อผู้ยืมเดิม">
        </div>
        <button class="btn btn-danger w-100 py-3" onclick="returnDevice()">
          <i class="bi bi-arrow-return-left me-1"></i>คืนอุปกรณ์ผ่าน LINE
        </button>
      </div>

      <hr class="my-3 border-secondary">
      <div id="message" class="small text-muted"></div>
    </div>
  </div>

  <div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-none">
        <div class="d-flex justify-content-center">
          <div class="loader-shell text-center text-white">
            <div class="spinner-border mb-3" role="status"></div>
            <div>กำลังประมวลผล...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const RAW_QUERY = {};
    const LIFF_ID = '2008359490-qm3K4L5x';
    // Replace this with the deployed Apps Script Web App URL ending in /exec
    const API_URL = 'https://script.google.com/macros/s/AKfycbzkgWzwmv768EfzxMhZU-TzuLrMCx73zJOByDFDFcnzbbLJsOaCNkaHzVcxbncB_-b2/exec?api=borrowPda';

    let loadingModal;
    let lineUserId = '';
    let lineDisplayName = '';
    let linePictureUrl = '';
    let deviceID = '';
    let liffFinished = false;

    function setMessage(msg) {
      document.getElementById('message').textContent = msg || '';
    }

    function showLoading(msg){
      if (msg) setMessage(msg);
      if (loadingModal) loadingModal.show();
    }

    function hideLoading(){
      try{
        if (loadingModal) loadingModal.hide();
      }catch(e){}
    }

    window.addEventListener('error', function(e){
      const msg = 'JS Error: ' + (e.message || e.error || e.toString());
      setMessage(msg);
      hideLoading();
      alert(msg);
    });

    window.addEventListener('unhandledrejection', function(e){
      const reason = e.reason || {};
      const msg = 'Promise Error: ' + (reason.message || reason.code || reason.toString());
      setMessage(msg);
      hideLoading();
      alert(msg);
    });

    function getDeviceFromQuery(){
      try {
        if (RAW_QUERY && typeof RAW_QUERY === 'object') {
          if (RAW_QUERY.device) {
            return String(RAW_QUERY.device).toUpperCase();
          }
          if (RAW_QUERY['liff.state']) {
            const stateParams = new URLSearchParams(String(RAW_QUERY['liff.state']));
            const d = stateParams.get('device') || stateParams.get('DEVICE') || '';
            if (d) return d.toUpperCase();
          }
        }
        const params = new URLSearchParams(location.search || '');
        const direct = params.get('device');
        if (direct) return direct.toUpperCase();

        const liffState = params.get('liff.state');
        if (liffState) {
          const sp = new URLSearchParams(liffState);
          const d = sp.get('device') || sp.get('DEVICE') || '';
          if (d) return d.toUpperCase();
        }
      } catch (e) {
        setMessage('อ่านค่า device จาก URL ไม่ได้: ' + e);
      }
      return '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const modalEl = document.getElementById('loadingModal');
      loadingModal = new bootstrap.Modal(modalEl, {
        backdrop:'static',
        keyboard:false
      });

      deviceID = getDeviceFromQuery();
      tryInitLiffWithTimeout();
    });

    function tryInitLiffWithTimeout(){
      showLoading('กำลังเชื่อมต่อ LINE LIFF...');

      if (typeof liff === 'undefined') {
        startAppWithoutLiff('ไม่สามารถโหลด LIFF SDK ได้');
        return;
      }

      let timeoutId = setTimeout(() => {
        if (!liffFinished) {
          startAppWithoutLiff('การเชื่อมต่อกับ LIFF ช้าผิดปกติ');
        }
      }, 15000);

      setMessage('เรียกใช้ liff.init...');

      liff.init({ liffId: LIFF_ID })
        .then(async () => {
          if (liffFinished) return;
          setMessage('เชื่อมต่อ LIFF สำเร็จ กำลังตรวจสอบโปรไฟล์...');

          let profile = null;
          let ctx = null;
          let profileError = null;
          let contextError = null;

          // แยกคำสั่งเพื่อระบุให้ได้ว่าการอ่านโปรไฟล์หรือ Context ล้มเหลว
          try {
            if (typeof liff.isLoggedIn === 'function' && !liff.isLoggedIn()) {
              profileError = new Error('LINE ยังไม่ได้เข้าสู่ระบบ LIFF');
            } else {
              profile = await liff.getProfile();
            }
          } catch (err) {
            profileError = err;
          }

          try {
            ctx = liff.getContext();
          } catch (err) {
            contextError = err;
          }

          if (liffFinished) return;

          const resolvedDisplayName = (profile && profile.displayName)
            ? String(profile.displayName).trim()
            : '';
          const resolvedUserId = (profile && profile.userId)
            ? String(profile.userId).trim()
            : ((ctx && ctx.userId) ? String(ctx.userId).trim() : '');

          lineDisplayName = resolvedDisplayName;
          lineUserId = resolvedUserId;
          linePictureUrl = (profile && profile.pictureUrl) ? String(profile.pictureUrl) : '';
          const pictureEl = document.getElementById('user-picture');
          if (linePictureUrl && pictureEl) {
            pictureEl.src = linePictureUrl;
            pictureEl.style.display = 'block';
            pictureEl.onerror = () => { pictureEl.style.display = 'none'; };
          }

          if (lineDisplayName) {
            document.getElementById('user-name').textContent = lineDisplayName;
          } else {
            document.getElementById('user-name').textContent = 'ไม่ได้รับชื่อจาก LINE';
          }
          document.getElementById('user-id').textContent =
            lineUserId ? lineUserId.substring(0, 6) + '…' : '';

          const borrowerInput = document.getElementById('borrower');
          if (lineDisplayName && borrowerInput && !borrowerInput.value) {
            borrowerInput.value = lineDisplayName;
          }

          liffFinished = true;
          clearTimeout(timeoutId);
          startApp();

          if (!lineUserId || !lineDisplayName) {
            const details = [];
            if (profileError) {
              details.push('getProfile: ' + (profileError.message || profileError.code || String(profileError)));
            }
            if (contextError) {
              details.push('getContext: ' + (contextError.message || contextError.code || String(contextError)));
            }
            if (!details.length) {
              details.push('LINE ไม่ส่ง User ID หรือ Display Name กลับมา');
            }
            setMessage('เปิดใช้งานได้ แต่ดึงโปรไฟล์ LINE ไม่ครบ (' +
              details.join(' | ') +
              ') กรุณากรอกชื่อผู้ยืมเอง ระบบจะบันทึกข้อมูล LINE เฉพาะเมื่ออ่านได้');
          } else {
            setMessage('ยืนยันโปรไฟล์ LINE สำเร็จ');
          }
        })
        .catch(err => {
          if (liffFinished) return;
          clearTimeout(timeoutId);
          startAppWithoutLiff(
            'เริ่มต้น LIFF ไม่สำเร็จ: ' +
            (err && (err.message || err.code) ? (err.message || err.code) : String(err))
          );
        });
    }

    function startAppWithoutLiff(reason){
      if (liffFinished) return;
      liffFinished = true;
      hideLoading();
      setMessage((reason ? reason + ' — ' : '') +
        'ยังอ่านโปรไฟล์ LINE ไม่ได้ แต่ยังทำรายการได้โดยกรอกชื่อผู้ยืมเอง ชื่อ LINE จะบันทึกได้เมื่ออนุญาต Scope profile');
      // Keep the original borrowing workflow usable when LINE profile lookup fails.
      // Never invent a LINE user ID/display name; use manual borrower name as fallback.
      startApp();
    }

    function startApp(){
      if (!deviceID) {
        hideLoading();
        document.getElementById('dev-name').textContent = 'ไม่มีรหัสอุปกรณ์';
        document.getElementById('no-device-alert').classList.remove('d-none');
        setMessage('ไม่พบพารามิเตอร์ device ใน URL กรุณาสแกน QR อุปกรณ์อีกครั้ง');
        return;
      }
      loadDevice();
    }

    function loadDevice(){
      showLoading('กำลังโหลดข้อมูลอุปกรณ์...');

      apiCall({ action: 'status', deviceID }, res => {
        if (res && res.ok) renderDevice(res.data);
        else {
          hideLoading();
          document.getElementById('dev-name').textContent = 'เกิดข้อผิดพลาด';
          setMessage('ไม่สามารถโหลดข้อมูลอุปกรณ์ได้: ' + ((res && res.error) || 'API error'));
        }
      });
    }

    function renderDevice(info){
      hideLoading();

      if (!info) {
        document.getElementById('dev-name').textContent = 'ไม่พบอุปกรณ์ในระบบ';
        document.getElementById('dev-id').textContent   = deviceID;
        setMessage('ตรวจสอบ DeviceID ในชีต Devices อีกครั้ง');
        return;
      }

      document.getElementById('dev-name').textContent =
        info.Name || '(ไม่มีชื่ออุปกรณ์)';
      document.getElementById('dev-id').textContent =
        `รหัส: ${info.DeviceID} • หมวด: ${info.Category || '-'}`;

      const statusDiv = document.getElementById('dev-status');
      statusDiv.innerHTML = '';

      const pill = document.createElement('div');
      let cls = 'status-pill ';
      let icon = '';

      if (info.IsOverdue) {
        cls += 'status-over';
        pill.textContent = 'เกินกำหนดคืน';
        icon = '<i class="bi bi-exclamation-octagon-fill me-1"></i>';
      } else if (info.Status === 'Borrowed') {
        cls += 'status-bor';
        pill.textContent = 'ถูกยืมอยู่';
        icon = '<i class="bi bi-lock-fill me-1"></i>';
      } else {
        cls += 'status-ava';
        pill.textContent = 'พร้อมให้ยืม';
        icon = '<i class="bi bi-unlock-fill me-1"></i>';
      }

      pill.className = cls;
      pill.innerHTML = icon + pill.textContent;
      statusDiv.appendChild(pill);

      const formBorrow = document.getElementById('form-borrow');
      const formReturn = document.getElementById('form-return');
      let ownershipMessage = '';

      if (info.Status === 'Available') {
        formBorrow.style.display = 'block';
        formReturn.style.display = 'none';
      } else {
        formBorrow.style.display = 'none';
        formReturn.style.display = 'block';
      }

      const msg = [];
      if (info.CurrentUser) msg.push(`ผู้ยืม: ${info.CurrentUser}`);
      if (info.BorrowedAt) msg.push(`วันที่ยืม: ${formatDate(info.BorrowedAt)}`);
      if (info.DueAt)      msg.push(`กำหนดคืน: ${formatDate(info.DueAt)}`);
      if (ownershipMessage) msg.push(ownershipMessage);
      setMessage(msg.join(' | '));
    }

    function borrow(){
      const nameInput = document.getElementById('borrower').value.trim();

      // ถ้าไม่กรอก → ใช้ชื่อจาก LINE
      const nameBase  = nameInput || lineDisplayName;

      if (!deviceID) {
        alert('ไม่มีรหัสอุปกรณ์');
        return;
      }

      // Profile is optional for the transaction so a LIFF profile-scope/configuration
      // issue does not disable borrowing. Prefer LINE display name when available;
      // otherwise use the required manually-entered borrower name. Empty LINE fields
      // are passed explicitly and never fabricated.
      if (!nameBase) {
        alert('กรุณาระบุชื่อผู้ยืมในช่องชื่อผู้ยืม');
        document.getElementById('borrower').focus();
        return;
      }
      const name = nameBase;

      showLoading('กำลังบันทึกการยืม...');

      apiCall({
        action: 'borrow',
        deviceID, userName: name, lineUserId, lineDisplayName, linePictureUrl
      }, res => {
        hideLoading();
        if (!res || !res.ok) { alert((res && res.error) || 'ยืมไม่สำเร็จ'); return; }
        alert(res.data.message || 'ยืมสำเร็จ');
        if (res.data && res.data.newInfo) renderDevice(res.data.newInfo);
        else loadDevice();
      });
    }

    function returnDevice(){
      const returner = document.getElementById('returner').value.trim();
      if (!lineUserId && !returner) { alert('กรุณายืนยันชื่อผู้ยืมเดิม'); return; }
      if (!deviceID) {
        alert('ไม่มีรหัสอุปกรณ์');
        return;
      }

      showLoading('กำลังบันทึกการคืน...');

      apiCall({
        action: 'return',
        deviceID,
        userName: returner || lineDisplayName || '',
        lineUserId,
        lineDisplayName,
        linePictureUrl
      }, res => {
        hideLoading();
        if (!res || !res.ok) { alert((res && res.error) || 'คืนไม่สำเร็จ'); return; }
        alert(res.data.message || 'คืนสำเร็จ');
        if (res.data && res.data.newInfo) renderDevice(res.data.newInfo);
        else loadDevice();
      });
    }

    function apiCall(params, done) {
      if (!API_URL || API_URL.includes('PASTE_YOUR_')) {
        hideLoading();
        setMessage('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html');
        return;
      }
      const callbackName = '__borrowPdaCb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      const payload = Object.assign({}, params, { callback: callbackName });
      const query = Object.keys(payload).map(k =>
        encodeURIComponent(k) + '=' + encodeURIComponent(String(payload[k] == null ? '' : payload[k]))
      ).join('&');
      let finished = false;
      const timer = setTimeout(() => {
        if (finished) return;
        finished = true;
        cleanup();
        hideLoading();
        setMessage('API ไม่ตอบกลับภายใน 25 วินาที กรุณาตรวจ API_URL และ Deployment');
      }, 25000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[callbackName] = result => {
        if (finished) return;
        finished = true;
        cleanup();
        done(result);
      };
      script.onerror = () => {
        if (finished) return;
        finished = true;
        cleanup();
        hideLoading();
        setMessage('เรียก Apps Script API ไม่สำเร็จ กรุณาตรวจ URL และการ Deploy');
      };
      script.src = API_URL + (API_URL.includes('?') ? '&' : '?') + query;
      document.head.appendChild(script);
    }

    function formatDate(d){
      try{
        return new Date(d).toLocaleString('th-TH');
      }catch(e){
        return d;
      }
    }
  </script>
